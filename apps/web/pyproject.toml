[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-web"
version = "0.1.0"
description = "Chat web frontend for the dispute agent (FastAPI + static HTML/JS)"
requires-python = ">=3.12"
dependencies = [
    "bank-agent",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "python-dotenv>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.uv.sources]
bank-agent = { path = "../agent", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bank_web = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
