[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-mcp"
version = "0.1.0"
description = "MCP tools over bank_curated and the simulated bank_sandbox for the dispute agent"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.46,<4",
    "mcp[cli]>=2.2,<3",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
bank-mcp = "bank_mcp:main"
bank-mcp-token = "bank_mcp.tools.server:mint_token"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: BigQuery dry runs with your ADC; opt-in with -m integration"]
addopts = "-m 'not integration'"
