[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-agent"
version = "0.1.0"
description = "LangGraph transaction dispute workflow"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0,<2",
    # Real adapters: MCP client, LLM extraction, language detection (clients/mcp_services.py).
    "mcp>=2.2,<3",
    "langchain>=1.4,<2",
    "langchain-groq>=1.1,<2",
    "lingua-language-detector>=2.2,<3",
    # Web front (bank_agent/web): HTTP API + static files. Both already come with mcp.
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
bank-web = "bank_agent.web.app:main"

[dependency-groups]
# python-dotenv: only scripts/ and tests/integration load .env.
dev = ["pytest>=8,<10", "python-dotenv>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bank_agent = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: live agent -> MCP -> BigQuery tests; the server needs ADC and SESSION_SIGNING_KEY; DEV_SESSIONS=dev=<token from bank-mcp-token>"]
addopts = "-m 'not integration'"
